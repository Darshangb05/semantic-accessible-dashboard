<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Admin | Accessible Store</title>

    <link
        rel="stylesheet"
        href="css/styles.css"
    >

</head>

<body>

<header class="site-header">

    <div class="header-brand">

        <a
            href="index.html"
            class="brand-link"
        >
            Accessible Store
        </a>

    </div>

    <nav
        class="top-navigation"
        aria-label="Main navigation"
    >

        <ul>

            <li>
                <a href="products.html">
                    Products
                </a>
            </li>

            <li>
                <a
                    href="admin.html"
                    aria-current="page"
                >
                    Admin
                </a>
            </li>

        </ul>

    </nav>

</header>

<main class="main-content">

<section
    class="panel"
    aria-labelledby="admin-title"
>

    <h1 id="admin-title">
        Product Management
    </h1>

    <p>
        Create, update and delete products.
    </p>

    <form id="product-form">

        <input
            type="hidden"
            id="product-id"
        >

        <div class="form-group">

            <label for="product-title">
                Product title
            </label>

            <input
                type="text"
                id="product-title"
                required
            >

        </div>

        <div class="form-group">

            <label for="product-price">
                Price
            </label>

            <input
                type="number"
                id="product-price"
                min="0"
                step="0.01"
                required
            >

        </div>

        <div class="form-group">

            <label for="product-category">
                Category
            </label>

            <input
                type="text"
                id="product-category"
                required
            >

        </div>

        <div class="form-group">

            <label for="product-image">
                Image URL
            </label>

            <input
                type="url"
                id="product-image"
                required
            >

        </div>

        <div class="form-group">

            <label for="product-description">
                Description
            </label>

            <textarea
                id="product-description"
                rows="4"
                required
            ></textarea>

        </div>

        <button
            type="submit"
            class="primary-button"
        >
            Save Product
        </button>

        <button
            type="button"
            id="cancel-button"
            class="secondary-button"
        >
            Cancel
        </button>

    </form>

</section>

<section
    class="panel"
    aria-labelledby="manage-title"
>

    <h2 id="manage-title">
        Existing Products
    </h2>

    <div
        id="admin-products"
        class="admin-product-list"
    ></div>

</section>

</main>

<script
    type="module"
    src="js/admin.js"
></script>

</body>
</html>
