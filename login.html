<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login | Accessible Store</title>

    <link
        rel="stylesheet"
        href="css/styles.css"
    >
</head>

<body>

<header class="site-header">

    <div class="header-brand">
        <a
            href="index.html"
            class="brand-link"
        >
            Accessible Store
        </a>
    </div>

    <nav
        class="top-navigation"
        aria-label="Main navigation"
    >
        <ul>
            <li>
                <a href="index.html">
                    Home
                </a>
            </li>

            <li>
                <a href="products.html">
                    Products
                </a>
            </li>

            <li>
                <a href="cart.html">
                    Cart
                </a>
            </li>
        </ul>
    </nav>

</header>

<main class="main-content">

<section
    class="panel auth-panel"
    aria-labelledby="login-title"
>

    <h1 id="login-title">
        Sign In
    </h1>

    <p>
        Sign in to continue shopping.
    </p>

    <div
        id="login-message"
        class="error-banner"
        role="alert"
        hidden
    ></div>

    <form id="login-form">

        <div class="form-group">

            <label for="email">
                Email
            </label>

            <input
                type="email"
                id="email"
                required
                autocomplete="email"
                placeholder="you@example.com"
            >

        </div>

        <div class="form-group">

            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                required
                minlength="4"
                autocomplete="current-password"
                placeholder="Enter password"
            >

        </div>

        <button
            type="submit"
            class="primary-button"
        >
            Sign In
        </button>

    </form>

</section>

</main>

<script type="module">

import { loginUser } from "./js/auth.js";

const form =
    document.querySelector("#login-form");

const message =
    document.querySelector("#login-message");

form.addEventListener("submit", event => {

    event.preventDefault();

    const email =
        document.querySelector("#email").value.trim();

    const password =
        document.querySelector("#password").value;

    const result =
        loginUser(email, password);

    if (!result.success) {

        message.textContent =
            result.message;

        message.hidden = false;

        return;
    }

    window.location.href =
        "products.html";
});

</script>

</body>
</html>
