<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Products | Accessible Store</title>

    <link
        rel="stylesheet"
        href="css/styles.css"
    >

</head>

<body>

<header class="site-header">

    <div class="header-brand">

        <a
            href="index.html"
            class="brand-link"
        >
            Accessible Store
        </a>

    </div>

    <nav
        class="top-navigation"
        aria-label="Main navigation"
    >

        <ul>

            <li>
                <a href="index.html">
                    Home
                </a>
            </li>

            <li>
                <a
                    href="products.html"
                    aria-current="page"
                >
                    Products
                </a>
            </li>

            <li>
                <a href="cart.html">
                    Cart
                </a>
            </li>

            <li>
                <a href="login.html">
                    Login
                </a>
            </li>

            <li>
                <a href="admin.html">
                    Admin
                </a>
            </li>

        </ul>

    </nav>

</header>

<main class="main-content">

<section
    class="panel"
    aria-labelledby="products-title"
>

    <div class="page-heading">

        <div>

            <h1 id="products-title">
                Product Explorer
            </h1>

            <p>
                Explore products and add items to your cart.
            </p>

        </div>

    </div>

    <div
        id="error-message"
        class="error-banner"
        role="alert"
        hidden
    ></div>

    <div class="product-controls">

        <div>

            <label for="search-input">
                Search products
            </label>

            <input
                type="search"
                id="search-input"
                placeholder="Search products..."
                autocomplete="off"
            >

        </div>

        <div>

            <label for="sort-select">
                Sort products
            </label>

            <select id="sort-select">

                <option value="default">
                    Default
                </option>

                <option value="price-low">
                    Price: Low to High
                </option>

                <option value="price-high">
                    Price: High to Low
                </option>

                <option value="name">
                    Name
                </option>

            </select>

        </div>

    </div>

    <div
        id="category-tabs"
        class="category-tabs"
        role="group"
        aria-label="Product categories"
    ></div>

    <div
        id="loading-skeleton"
        class="loading-skeleton-grid"
        aria-live="polite"
    >

        <div class="skeleton-card"></div>
        <div class="skeleton-card"></div>
        <div class="skeleton-card"></div>
        <div class="skeleton-card"></div>

    </div>

    <div
        id="product-container"
        class="product-grid"
        aria-live="polite"
    ></div>

</section>

</main>

<footer class="site-footer">

    <p>
        © 2026 Accessible Store
    </p>

</footer>

<script
    type="module"
    src="js/products.js"
></script>

</body>
</html>
